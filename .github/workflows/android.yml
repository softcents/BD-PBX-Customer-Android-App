name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 29 and CMake
        run: |
          sdkmanager "platforms;android-28" "ndk;29.0.14206865" "cmake;3.31.6"
          sudo mkdir -p /opt/Android/ndk
          sudo ln -sfn "$ANDROID_HOME/ndk/29.0.14206865" /opt/Android/ndk/29.0.14206865
          sudo mkdir -p /usr/src
          sudo ln -sfn "$GITHUB_WORKSPACE" /usr/src/baresip-studio

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake make libtool m4 automake pkg-config unzip

      - name: Build Baresip native libraries
        run: |
          git clone --depth 1 --branch master https://github.com/juha-h/libbaresip-android.git "$RUNNER_TEMP/libbaresip-android"
          cd "$RUNNER_TEMP/libbaresip-android"
          make download-sources
          make libbaresip ANDROID_TARGET_ARCH=armeabi-v7a
          make libbaresip ANDROID_TARGET_ARCH=arm64-v8a
          make libbaresip ANDROID_TARGET_ARCH=x86_64

      - name: Verify native libraries
        run: |
          test -f distribution/baresip/lib/armeabi-v7a/libbaresip.a
          test -f distribution/baresip/lib/arm64-v8a/libbaresip.a
          test -f distribution/baresip/lib/x86_64/libbaresip.a
          echo "Native Baresip libraries are ready"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Set BD PBX app name
        run: |
          sed -i 's#<string name="app_name" translatable="false">baresip</string>#<string name="app_name" translatable="false">BD PBX</string>#' app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name_plus" translatable="false">baresip+</string>#<string name="app_name_plus" translatable="false">BD PBX</string>#' app/src/main/res/values/strings.xml

      - name: Enable WhatsApp-style incoming call screen
        run: |
          cat > app/src/main/kotlin/com/tutpro/baresip/IncomingCallNotifier.kt <<'KOTLIN'
          package com.tutpro.baresip

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.os.Build
          import android.provider.Settings
          import androidx.core.app.NotificationCompat

          object IncomingCallNotifier {
              const val NOTIFICATION_ID = 8801
              private const val CHANNEL_ID = "bd_pbx_incoming_calls"

              fun show(context: Context, callp: Long, caller: String) {
                  val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  val ringtone = Settings.System.DEFAULT_RINGTONE_URI
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(
                          CHANNEL_ID, "Incoming calls", NotificationManager.IMPORTANCE_HIGH
                      ).apply {
                          description = "BD PBX incoming SIP calls"
                          lockscreenVisibility = android.app.Notification.VISIBILITY_PUBLIC
                          setSound(ringtone, AudioAttributes.Builder()
                              .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
                              .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                              .build())
                          enableVibration(true)
                      }
                      nm.createNotificationChannel(channel)
                  }

                  val fullScreenIntent = Intent(context, IncomingCallActivity::class.java).apply {
                      putExtra("callp", callp)
                      putExtra("caller", caller)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                  }
                  val fullScreenPendingIntent = PendingIntent.getActivity(
                      context, callp.toInt(), fullScreenIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)

                  val notification = NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_call)
                      .setContentTitle("BD PBX")
                      .setContentText("Incoming call from $caller")
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setAutoCancel(false)
                      .setSound(ringtone)
                      .setFullScreenIntent(fullScreenPendingIntent, true)
                      .setContentIntent(fullScreenPendingIntent)
                      .build()

                  nm.notify(NOTIFICATION_ID, notification)
              }

              fun cancel(context: Context) {
                  (context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .cancel(NOTIFICATION_ID)
              }
          }
          KOTLIN

          cat > app/src/main/kotlin/com/tutpro/baresip/IncomingCallActivity.kt <<'KOTLIN'
          package com.tutpro.baresip

          import android.app.Activity
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class IncomingCallActivity : Activity() {
              private var callp: Long = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  callp = intent.getLongExtra("callp", 0L)
                  val caller = intent.getStringExtra("caller").orEmpty().ifBlank { "Unknown caller" }

                  if (Build.VERSION.SDK_INT >= 27) {
                      setShowWhenLocked(true)
                      setTurnScreenOn(true)
                  }
                  window.addFlags(WindowManager.LayoutParams.FLAG_SHOW_WHEN_LOCKED or
                      WindowManager.LayoutParams.FLAG_TURN_SCREEN_ON or
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(48, 48, 48, 48)
                  }
                  root.addView(TextView(this).apply {
                      text = "BD PBX"
                      textSize = 30f
                      gravity = Gravity.CENTER
                  }, LinearLayout.LayoutParams(-1, -2))
                  root.addView(TextView(this).apply {
                      text = caller
                      textSize = 24f
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 48)
                  }, LinearLayout.LayoutParams(-1, -2))
                  root.addView(Button(this).apply {
                      text = "Answer"
                      textSize = 18f
                      setOnClickListener { answerCall() }
                  }, LinearLayout.LayoutParams(-1, -2))
                  root.addView(Button(this).apply {
                      text = "Decline"
                      textSize = 18f
                      setOnClickListener { rejectCall() }
                  }, LinearLayout.LayoutParams(-1, -2).apply { topMargin = 12 })
                  setContentView(root)
              }

              private fun answerCall() {
                  IncomingCallNotifier.cancel(this)
                  ConnectionService.connections[callp]?.onAnswer()
                  finish()
              }

              private fun rejectCall() {
                  IncomingCallNotifier.cancel(this)
                  ConnectionService.connections[callp]?.onReject()
                  finish()
              }

              override fun onBackPressed() {
                  rejectCall()
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          marker = '        <activity\n            android:name=".ComposeActivity"'
          activity = '''        <activity
              android:name=".IncomingCallActivity"
              android:exported="false"
              android:excludeFromRecents="true"
              android:showWhenLocked="true"
              android:turnScreenOn="true"
              android:launchMode="singleTop" />

          '''
          if ".IncomingCallActivity" not in text:
              text = text.replace(marker, activity + marker, 1)
          manifest.write_text(text)

          cs = Path("app/src/main/kotlin/com/tutpro/baresip/ConnectionService.kt")
          text = cs.read_text()
          target = '''            connection.setRinging()
            if (ua.account.answerMode == Api.ANSWERMODE_AUTO) {'''
          replacement = '''            connection.setRinging()
            IncomingCallNotifier.show(this, callp, contactName)
            try {
                val incomingIntent = Intent(this, IncomingCallActivity::class.java).apply {
                    putExtra("callp", callp)
                    putExtra("caller", contactName)
                    addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                }
                startActivity(incomingIntent)
            } catch (e: Exception) {
                Log.w(TAG, "Direct incoming call screen launch blocked; full-screen notification remains active", e)
            }
            if (ua.account.answerMode == Api.ANSWERMODE_AUTO) {'''
          if target not in text:
              raise SystemExit("ConnectionService incoming-call patch target not found")
          text = text.replace(target, replacement, 1)
          for target_line in [
              '            Log.d(TAG, "Telecom Connection onAnswer $callp")',
              '            Log.d(TAG, "Telecom Connection onReject $callp")',
              '            Log.d(TAG, "Telecom Connection onDisconnect $callp")',
              '            Log.d(TAG, "Telecom Connection onAbort $callp")'
          ]:
              text = text.replace(target_line, '            IncomingCallNotifier.cancel(this@ConnectionService)\n' + target_line, 1)
          cs.write_text(text)
          PY

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Customer-Android-App-debug
          path: app/build/outputs/apk/debug/*.apk
