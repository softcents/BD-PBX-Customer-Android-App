name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 29 and CMake
        run: |
          sdkmanager "platforms;android-28" "ndk;29.0.14206865" "cmake;3.31.6" "build-tools;35.0.0"
          sudo mkdir -p /opt/Android/ndk
          sudo ln -sfn "$ANDROID_HOME/ndk/29.0.14206865" /opt/Android/ndk/29.0.14206865
          sudo mkdir -p /usr/src
          sudo ln -sfn "$GITHUB_WORKSPACE" /usr/src/baresip-studio

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget cmake make libtool m4 automake pkg-config unzip

      - name: Build Baresip native libraries
        run: |
          git clone --depth 1 --branch master https://github.com/juha-h/libbaresip-android.git "$RUNNER_TEMP/libbaresip-android"
          cd "$RUNNER_TEMP/libbaresip-android"
          make download-sources
          make libbaresip ANDROID_TARGET_ARCH=armeabi-v7a
          make libbaresip ANDROID_TARGET_ARCH=arm64-v8a
          make libbaresip ANDROID_TARGET_ARCH=x86_64

      - name: Verify native libraries
        run: |
          test -f distribution/baresip/lib/armeabi-v7a/libbaresip.a
          test -f distribution/baresip/lib/arm64-v8a/libbaresip.a
          test -f distribution/baresip/lib/x86_64/libbaresip.a
          echo "Native Baresip libraries are ready"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Set BD PBX app name
        run: |
          sed -i 's#<string name="app_name" translatable="false">baresip</string>#<string name="app_name" translatable="false">BD PBX</string>#' app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name_plus" translatable="false">baresip+</string>#<string name="app_name_plus" translatable="false">BD PBX</string>#' app/src/main/res/values/strings.xml

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Zipalign APK for 16 KB page-size devices
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 app/build/outputs/apk/debug/app-debug.apk app-debug-aligned.apk
          mv app-debug-aligned.apk app/build/outputs/apk/debug/app-debug-unsigned.apk

      - name: Re-sign aligned APK
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BUILD_TOOLS/apksigner" sign \
            --ks ~/.android/debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app/build/outputs/apk/debug/app-debug.apk \
            app/build/outputs/apk/debug/app-debug-unsigned.apk
          rm -f app/build/outputs/apk/debug/app-debug-unsigned.apk

      - name: Verify APK signature and alignment
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BD-PBX-Customer-Android-App-debug
          path: app/build/outputs/apk/debug/*.apk
